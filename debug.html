<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>debug grid</title>
<style>html,body{margin:0;background:#111;overflow:hidden}#log{position:fixed;left:0;bottom:0;z-index:9;white-space:pre;color:#7f7;font:10px monospace;background:rgba(0,0,0,.6);padding:4px;max-height:38vh;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div id="log">loading…</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const report = { errors: [] };
window.addEventListener('error', e => report.errors.push(String(e.message)));

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(1);
renderer.setScissorTest(true);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x333333, 2.2));
const d = new THREE.DirectionalLight(0xffffff, 2.2); d.position.set(2, 4, 3); scene.add(d);

const cam = new THREE.PerspectiveCamera(32, 1, 0.01, 100);
cam.position.set(1.35, 1.05, 2.0); cam.lookAt(0.25, 0.35, 0.1);

new GLTFLoader().load('./urbanbot-s1.glb', (gltf) => {
  const root = gltf.scene; scene.add(root);
  const mixer = new THREE.AnimationMixer(root);
  mixer.clipAction(gltf.animations[0]).play();

  const rig = root.getObjectByName('Patrol_Rig');
  const spray = root.getObjectByName('SnowSpray');
  const f1 = root.getObjectByName('SnowFlake_01');
  report.hierarchy = [f1.parent.name, '->', spray.parent.name, '->', root.children[0].name];

  const times = [0.9, 1.7, 2.6, 5.3, 6.4, 8.9];
  const cols = 3, rows = 2;
  const w = Math.floor(innerWidth / cols), h = Math.floor(innerHeight / rows);
  const drawn = [];
  times.forEach((t, i) => {
    mixer.setTime(t);
    const p = new THREE.Vector3(); f1.getWorldPosition(p);
    const rp = new THREE.Vector3(); rig.getWorldPosition(rp);
    drawn.push('t=' + t + ' rig=(' + rp.x.toFixed(2) + ',' + rp.y.toFixed(2) + ',' + rp.z.toFixed(2) + ') f1=(' + p.x.toFixed(2) + ',' + p.y.toFixed(2) + ',' + p.z.toFixed(2) + ') f1s=' + f1.scale.x.toFixed(4));
    const x = (i % cols) * w, y = Math.floor(i / cols) * h;
    renderer.setViewport(x, innerHeight - y - h, w, h);
    renderer.setScissor(x, innerHeight - y - h, w, h);
    renderer.render(scene, cam);
  });
  window.__report = report;
  document.getElementById('log').textContent = drawn.join('\n');
}, undefined, e => { report.errors.push('load ' + e); document.getElementById('log').textContent = JSON.stringify(report); });
</script>
</body></html>
