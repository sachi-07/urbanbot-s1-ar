<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A1D21">
<title>어반봇 S1 · WebAR</title>
<meta name="description" content="사계절 자율주행 도시관리·제설 로봇 어반봇 S1을 증강현실로 바닥에 띄워보세요.">
<meta property="og:type" content="website">
<meta property="og:title" content="어반봇 S1 · WebAR">
<meta property="og:description" content="사계절 자율주행 도시관리·제설 로봇 어반봇 S1을 증강현실로 바닥에 띄워보세요.">
<link rel="preconnect" href="https://ajax.googleapis.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
  :root{
    --ink:#1A1D21;
    --ink-deep:#0E1012;
    --chalk:#FFFFFF;
    --ice:#A9C7E8;
    --muted:rgba(255,255,255,.58);
    --hair:rgba(255,255,255,.14);
    --pad:clamp(20px, 6vw, 34px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--chalk);
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    overscroll-behavior:none;
  }
  .stage{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    background:
      radial-gradient(120% 70% at 50% 34%, #2A2F36 0%, #1A1D21 46%, #101215 100%),
      var(--ink);
  }
  /* cold light pool under the robot */
  .stage::before{
    content:""; position:absolute; left:50%; top:62%;
    width:min(120vw,760px); height:min(60vw,380px);
    transform:translate(-50%,-50%);
    background:radial-gradient(closest-side, rgba(169,199,232,.14), rgba(169,199,232,0) 72%);
    pointer-events:none;
  }
  /* faint horizon hairline */
  .stage::after{
    content:""; position:absolute; left:0; right:0; top:0; height:1px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.16), transparent);
    pointer-events:none;
  }

  model-viewer{
    position:absolute; inset:0;
    width:100%; height:100%;
    background:transparent;
    --poster-color:transparent;
    --progress-bar-color:transparent;
    --progress-mask:transparent;
  }

  .hud{position:absolute; left:0; right:0; z-index:3; pointer-events:none;}
  .hud-top{
    top:0; padding:calc(env(safe-area-inset-top) + 26px) var(--pad) 0;
  }
  .eyebrow{
    margin:0 0 14px;
    font-size:10px; font-weight:600; letter-spacing:.34em; text-transform:uppercase;
    color:rgba(255,255,255,.42);
  }
  .eyebrow span{color:rgba(169,199,232,.85);}
  h1{
    margin:0;
    font-size:clamp(25px, 7.6vw, 36px);
    line-height:1.12; font-weight:700; letter-spacing:-.025em;
    text-shadow:0 2px 24px rgba(0,0,0,.45);
  }
  h1 small{
    display:block; margin-top:7px;
    font-size:clamp(11px, 3.1vw, 13px); font-weight:500; letter-spacing:.14em;
    color:var(--muted); text-transform:uppercase;
  }
  .sub{
    margin:12px 0 0; max-width:19em;
    font-size:clamp(12.5px, 3.5vw, 14px); line-height:1.55; color:rgba(255,255,255,.74);
  }
  .rule{
    width:34px; height:2px; margin:0 0 16px;
    background:linear-gradient(90deg, var(--ice), rgba(169,199,232,0));
  }

  .hud-bottom{
    bottom:0;
    padding:0 var(--pad) calc(env(safe-area-inset-bottom) + 26px);
  }
  .chips{
    display:flex; flex-wrap:wrap; gap:7px;
    margin:0 0 14px; padding:0; list-style:none;
  }
  .chips li{
    padding:6px 11px;
    border:1px solid var(--hair); border-radius:999px;
    font-size:11.5px; letter-spacing:.01em; color:rgba(255,255,255,.72);
    background:rgba(255,255,255,.035);
    backdrop-filter:blur(6px);
  }
  .hint{
    margin:0;
    font-size:11.5px; line-height:1.6; color:rgba(255,255,255,.46);
    min-height:37px;
  }
  .hint b{color:rgba(255,255,255,.7); font-weight:600;}

  /* AR 진입 버튼 (model-viewer slot) */
  .ar-btn{
    position:fixed; z-index:5;
    left:50%; bottom:calc(env(safe-area-inset-bottom) + 118px);
    transform:translateX(-50%);
    display:flex; align-items:center; gap:10px;
    height:56px; padding:0 26px;
    border:0; border-radius:999px;
    background:var(--chalk); color:#14171A;
    font-family:inherit; font-size:15.5px; font-weight:700; letter-spacing:-.01em;
    box-shadow:0 10px 30px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.5) inset;
    cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .ar-btn:active{transform:translateX(-50%) scale(.965);}
  .ar-btn svg{width:20px; height:20px; flex:none;}
  .ar-btn[hidden]{display:none;}
  .ar-btn::after{
    content:""; position:absolute; inset:-6px; border-radius:999px;
    border:1px solid rgba(255,255,255,.22);
    animation:pulse 2.6s ease-out infinite;
    pointer-events:none;
  }
  @keyframes pulse{0%{opacity:.65; transform:scale(.98);} 70%{opacity:0; transform:scale(1.1);} 100%{opacity:0;}}

  .loading{
    position:absolute; inset:0; z-index:6;
    display:flex; align-items:center; justify-content:center; gap:11px;
    background:#15181C;
    font-size:12px; letter-spacing:.06em; color:rgba(255,255,255,.55);
    transition:opacity .5s ease;
  }
  .loading[data-done="1"]{opacity:0; pointer-events:none;}
  .dot{width:6px; height:6px; border-radius:50%; background:var(--ice); animation:blink 1.1s ease-in-out infinite;}
  .dot:nth-child(2){animation-delay:.18s;} .dot:nth-child(3){animation-delay:.36s;}
  @keyframes blink{0%,100%{opacity:.25;} 50%{opacity:1;}}

  @media (min-width:720px){
    .hud-top{padding-top:calc(env(safe-area-inset-top) + 44px);}
    .hud-bottom{padding-bottom:calc(env(safe-area-inset-bottom) + 40px);}
    .ar-btn{bottom:calc(env(safe-area-inset-bottom) + 150px);}
    .hint{font-size:12px;}
  }
  @media (max-height:600px){
    .sub, .chips{display:none;}
    .ar-btn{bottom:calc(env(safe-area-inset-bottom) + 84px); height:50px;}
    .hint{min-height:0;}
  }
  @media (prefers-reduced-motion:reduce){
    .ar-btn::after, .dot{animation:none;}
  }
  noscript p{position:absolute; inset:auto 0 40% 0; text-align:center; padding:0 24px; font-size:13px; color:rgba(255,255,255,.7);}
</style>
</head>
<body>
<main class="stage">
  <model-viewer id="viewer"
      src="./urbanbot-s1.glb"
      alt="어반봇 S1 3D 모델"
      ar
      ar-modes="webxr scene-viewer quick-look"
      ar-scale="auto"
      ar-placement="floor"
      autoplay
      camera-controls
      disable-pan
      touch-action="pan-y"
      shadow-intensity="1"
      shadow-softness="0.85"
      exposure="1.05"
      environment-image="neutral"
      interaction-prompt="none"
      camera-orbit="26deg 76deg 2.15m"
      min-camera-orbit="auto 55deg auto"
      max-camera-orbit="auto 92deg auto"
      loading="eager"
      reveal="auto">
    <button id="arButton" slot="ar-button" class="ar-btn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
        <path d="M12 2.9 20.2 7v10L12 21.1 3.8 17V7L12 2.9Z"/>
        <path d="M3.8 7 12 11.1 20.2 7M12 11.1V21"/>
      </svg>
      AR로 바닥에 띄워보기
    </button>
  </model-viewer>

  <header class="hud hud-top">
    <div class="rule"></div>
    <p class="eyebrow">Seoul Smart <span>Urban-Bot</span></p>
    <h1>어반봇 S1<small>UrbanBot S1</small></h1>
    <p class="sub">사계절 자율주행 도시관리 · 제설 로봇</p>
  </header>

  <footer class="hud hud-bottom">
    <ul class="chips">
      <li>V-블레이드 제설</li>
      <li>사계절 교체 파츠</li>
      <li>저상 살수</li>
    </ul>
    <p class="hint" id="hint">불러오는 중…</p>
  </footer>

  <div class="loading" id="loading">
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    <span>3D 모델 불러오는 중</span>
  </div>

  <noscript><p>3D 모델을 보려면 JavaScript를 켜 주세요.</p></noscript>
</main>

<script>
(function () {
  var viewer = document.getElementById('viewer');
  var loading = document.getElementById('loading');
  var hint = document.getElementById('hint');
  var arButton = document.getElementById('arButton');

  var ua = navigator.userAgent || '';
  var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/.test(ua);

  var hintIOS = '<b>AR 버튼</b>을 누르면 카메라가 열립니다. 바닥을 비추고 화면을 탭하면 로봇이 그 자리에 섭니다.';
  var hintAndroid = '<b>AR 버튼</b>을 누르면 카메라가 열립니다. 바닥을 비추며 기기를 움직여 위치를 잡고 화면을 눌러 놓으세요.';
  var hintDesktop = '휴대폰으로 이 페이지를 열면 로봇을 <b>바닥에 띄워</b> 볼 수 있습니다. 지금은 손가락(마우스)으로 돌려보세요.';

  function setHint(arOk) {
    var base = isIOS ? hintIOS : (isAndroid ? hintAndroid : hintDesktop);
    if (!arOk) {
      base = '이 브라우저에서는 AR을 지원하지 않아요. 3D 모델을 손가락으로 돌려볼 수 있습니다.';
    }
    hint.innerHTML = base;
  }

  function done() {
    loading.dataset.done = '1';
  }

  viewer.addEventListener('load', function () {
    done();
    setHint(true);
    // AR을 쓸 수 없으면 model-viewer가 버튼을 숨기므로 그때만 안내를 바꾼다.
    requestAnimationFrame(function () {
      if (viewer.canActivateAR === false) {
        setHint(false);
      }
    });
  }, { once: true });

  viewer.addEventListener('error', function () {
    loading.innerHTML = '<span>모델을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</span>';
  });

  // model-viewer 스크립트가 CDN에서 오지 않으면 안내를 남긴다.
  window.addEventListener('load', function () {
    if (!window.customElements || !customElements.get('model-viewer')) {
      loading.innerHTML = '<span>3D 뷰어를 불러오지 못했습니다. 네트워크를 확인해 주세요.</span>';
    }
  });

  arButton.addEventListener('click', function () {
    if (viewer.canActivateAR === false && isIOS && !/Safari/.test(ua)) {
      hint.innerHTML = 'iPhone에서는 <b>Safari</b>로 열어야 AR이 동작합니다.';
    }
  });
})();
</script>
</body>
</html>
