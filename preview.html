<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>mobile preview</title>
<style>body{margin:0;background:#2b2f34;font:11px monospace;color:#ccc;padding:10px}
figure{margin:0}figcaption{padding:2px 0}iframe{border:0;background:#111;display:block}</style></head>
<body>
<figure><figcaption id="cap">390 x 844</figcaption><iframe id="f" src="./index.html" width="390" height="844"></iframe></figure>
<script>
  const q = new URLSearchParams(location.search);
  const w = q.get('w') || 390, h = q.get('h') || 844;
  const f = document.getElementById('f');
  f.width = w; f.height = h;
  document.getElementById('cap').textContent = w + ' x ' + h + ' (/?w=' + w + '&h=' + h + ')';
</script>
</body></html>
